<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Griddle — A Lunch Rush Case Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#FDF1E9;
    --bg:#EDF3FA;
    --card:#FFFFFF;
    --white:#FFFFFF;
    --ink:#1F2E37;
    --ink-soft:#54666D;
    --faint:#93A5AB;
    --blue:#4A9BD1;
    --blue-dark:#2B6FA3;
    --blue-light:#8FCBEF;
    --orange:#EA8C36;
    --orange-dark:#C96F1F;
    --orange-light:#F3A65C;
    --footer-dark:#22496B;
    --border:#D9E5F2;
    --tint:#EAF2FB;
    --tint-peach:#FDF1E9;
    --shadow-card:rgba(23,50,77,0.12);
    --shadow-btn:rgba(43,111,163,0.3);
    --ok-bg:#DCEAD8;
    --ok-text:#274B26;
    --ok-border:#4B7A4A;
    --err-bg:#FBE1DC;
    --err-text:#8A3420;
    --err-border:#D9714F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:linear-gradient(180deg, var(--bg-top) 0px, var(--bg) 360px);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .app{
    width:100%;
    max-width:880px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 20px 32px;
    transition:max-width .2s ease;
  }
  .app.wide-page{
    max-width:1120px;
  }

  /* ---------- Header / Rail ---------- */
  .app-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:1px solid var(--border);
    padding-bottom:14px;
    margin-bottom:26px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .eyebrow{
    font-family:'Inter', sans-serif;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--orange);
    font-weight:700;
  }
  .brand h1{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:38px;
    letter-spacing:-0.01em;
    margin:0;
    line-height:1.05;
    color:var(--blue-dark);
  }
  .rail{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .rail-step{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .rail-dot{
    width:30px;height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins', sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    transition:all .25s ease;
  }
  .rail-label{
    font-family:'Inter', sans-serif;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--faint);
    max-width:70px;
    line-height:1.2;
  }
  .rail-step.active .rail-dot{
    background:linear-gradient(135deg, var(--blue-light), var(--blue-dark));
    border-color:transparent;
    color:#fff;
    box-shadow:0 2px 8px var(--shadow-btn);
  }
  .rail-step.active .rail-label{color:var(--blue-dark); font-weight:700;}
  .rail-step.done .rail-dot{
    background:var(--blue-light);
    border-color:var(--blue);
    color:var(--blue-dark);
  }
  .rail-step.locked .rail-dot{opacity:0.5;}
  .rail-step.locked .rail-label{opacity:0.5;}
  .rail-connector{
    width:18px;height:2px;
    background:var(--border);
    margin-bottom:16px;
  }

  /* ---------- Stage ---------- */
  .stage-wrap{flex:1; display:flex;}
  .card{
    background:var(--card);
    border:none;
    border-radius:18px;
    padding:36px 34px;
    width:100%;
    position:relative;
    box-shadow:0 8px 28px var(--shadow-card);
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg, var(--blue-light), var(--blue), var(--orange-light));
    opacity:0.9;
    border-radius:18px 18px 0 0;
  }
  .kicker{
    font-family:'Inter', sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--orange);
    font-weight:700;
    margin:6px 0 6px;
  }
  h2.page-title{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:32px;
    letter-spacing:-0.01em;
    margin:0 0 14px;
    color:var(--ink);
  }
  p{line-height:1.65; color:var(--ink); font-size:15.5px;}
  .lead{font-size:17px; color:var(--ink);}
  .muted{color:var(--ink-soft);}

  /* ---------- Intro page ---------- */
  .scene{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
    margin-top:18px;
  }
  .scene.three-col{
    grid-template-columns:repeat(3, 1fr);
  }
  @media (max-width:700px){
    .scene.three-col{grid-template-columns:1fr;}
  }
  .scene-card{
    background:var(--tint);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 20px;
  }
  .scene-card h3{
    margin:0 0 8px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:-0.01em;
    color:var(--blue-dark);
  }
  .goal-box{
    margin-top:18px;
    border-left:4px solid var(--orange);
    background:var(--tint-peach);
    padding:14px 18px;
    border-radius:10px;
  }
  .goal-box strong{color:var(--orange-dark);}

  /* ---------- Game page ---------- */
  .morning-intro{
    background:var(--tint);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    text-align:center;
  }
  .morning-intro .btn{margin-top:10px;}

  .morning-scene{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin:16px 0;
  }
  .customer-lane{
    flex:1.3 1 220px;
    min-height:150px;
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:12px;
    background:var(--tint);
  }
  .customer-chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:popIn .35s ease;
  }
  @keyframes popIn{
    from{opacity:0; transform:translateY(8px) scale(0.9);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .customer-chip .face{font-size:26px; line-height:1;}
  .customer-chip .order-bubble{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px 10px;
    margin-top:5px;
    font-family:'Inter', sans-serif;
    font-size:10.5px;
    font-weight:500;
    white-space:nowrap;
  }
  .trend-board{
    flex:1 1 220px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
  }
  .trend-board h4{
    margin:0 0 12px;
    font-family:'Inter', sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-weight:700;
    color:var(--ink-soft);
  }
  .trend-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    transition:all .25s ease;
  }
  .trend-emoji{font-size:16px;}
  .trend-name{width:52px; flex:0 0 auto;}
  .trend-bar-wrap{
    flex:1;
    background:var(--tint);
    border-radius:999px;
    height:10px;
    overflow:hidden;
  }
  .trend-bar{
    display:block;
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--blue-light), var(--blue));
    transition:width .35s ease;
  }
  .trend-row.top3 .trend-bar{background:linear-gradient(90deg, var(--orange-light), var(--orange-dark));}
  .trend-row.top3 .trend-name{color:var(--orange-dark); font-weight:700;}
  .trend-count{width:16px; text-align:right; color:var(--ink-soft);}
  .morning-loaded-note{
    background:var(--ok-bg);
    border:1px solid var(--ok-border);
    color:var(--ok-text);
    border-radius:12px;
    padding:10px 14px;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:14px;
  }

  .rule-line{
    background:var(--tint-peach);
    border:1px solid var(--orange-light);
    border-radius:12px;
    padding:10px 14px;
    font-size:13.5px;
    margin-bottom:14px;
  }
  .status-line{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 14px;
    border-radius:12px;
    margin-bottom:12px;
  }
  .status-good{background:var(--ok-bg); color:var(--ok-text); border:1px solid var(--ok-border);}
  .status-warn{background:var(--err-bg); color:var(--err-text); border:1px solid var(--err-border);}
  .hud{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .hud-item{
    background:var(--tint);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 14px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:110px;
  }
  .hud-item .val{font-size:19px; font-weight:700; color:var(--blue-dark); font-family:'Poppins', sans-serif;}
  .hud-item .lbl{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--faint);}

  .history-panel{
    margin-bottom:14px;
  }
  .history-panel h4{
    margin:0 0 6px;
    font-family:'Inter', sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-weight:700;
    color:var(--ink-soft);
  }
  .ticket-row{
    display:flex;
    align-items:center;
    gap:8px;
    overflow-x:auto;
    padding:4px 4px 10px;
    margin-bottom:0;
  }
  .mini-ticket{
    flex:0 0 auto;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 12px;
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:500;
    text-align:center;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .mini-tag{font-size:12px;}

  .served-note{
    background:var(--ok-bg);
    border:1px solid var(--ok-border);
    color:var(--ok-text);
    border-radius:14px;
    padding:16px 18px;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:16px;
  }

  .order-board{
    display:flex;
    gap:26px;
    align-items:stretch;
    flex-wrap:wrap;
    margin:14px 0 22px;
  }
  .ticket-big{
    flex:1 1 220px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    position:relative;
    min-height:160px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    box-shadow:0 4px 16px var(--shadow-card);
  }
  .ticket-big .emoji{font-size:52px; margin-bottom:8px;}
  .ticket-big .dish-name{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:24px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .ticket-big .order-no{
    position:absolute; top:12px; left:16px;
    font-family:'Inter', sans-serif;
    font-size:11px;
    color:var(--faint);
  }

  .shelf-panel{
    flex:1 1 260px;
    background:var(--tint);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
  }
  .shelf-panel h4{
    margin:0 0 10px;
    font-family:'Inter', sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-weight:700;
    color:var(--ink-soft);
  }
  .shelf-slots{
    display:flex;
    gap:10px;
  }
  .shelf-slot{
    flex:1;
    height:96px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    position:relative;
    transition:all .2s ease;
  }
  .shelf-slot .se{font-size:30px;}
  .shelf-slot.empty{border-style:dashed; color:var(--faint);}
  .shelf-slot.evictable{
    border-color:var(--err-border);
    cursor:pointer;
    background:var(--err-bg);
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(217,113,79,0.35);}
    50%{box-shadow:0 0 0 6px rgba(217,113,79,0);}
  }

  .evict-banner{
    background:var(--err-border);
    color:#fff;
    padding:10px 16px;
    border-radius:12px;
    font-size:13.5px;
    margin-bottom:14px;
    font-weight:600;
  }

  .fetch-bar-wrap{
    height:8px;
    background:var(--tint);
    border-radius:999px;
    overflow:hidden;
    margin:14px 0 4px;
    display:none;
  }
  .fetch-bar-wrap.show{display:block;}
  .fetch-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--blue-light), var(--blue-dark));
    transition:width 0.9s linear;
  }
  .fetch-caption{
    font-family:'Inter', sans-serif;
    font-size:11px;
    color:var(--faint);
    display:none;
  }
  .fetch-caption.show{display:block;}

  .action-row{display:flex; gap:12px; margin-top:16px; align-items:center; flex-wrap:wrap;}

  .game-summary{
    background:var(--ok-bg);
    border:1px solid var(--ok-border);
    border-radius:16px;
    padding:18px 20px;
    margin-top:20px;
  }
  .game-summary h4{
    margin:0 0 8px;
    color:var(--ok-text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:21px;
    letter-spacing:-0.01em;
  }
  .compare-row{display:flex; gap:22px; flex-wrap:wrap; margin-top:10px;}
  .compare-item{
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
  }
  .compare-item .num{font-size:22px; font-weight:700; display:block; color:var(--ink); font-family:'Poppins', sans-serif;}

  /* ---------- Reflection page ---------- */
  .q-block{margin-bottom:22px;}
  .q-block label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    font-size:15px;
    color:var(--ink);
  }
  textarea{
    width:100%;
    min-height:80px;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    resize:vertical;
    background:var(--white);
    color:var(--ink);
  }
  textarea:focus{outline:2px solid var(--blue-light); outline-offset:1px;}

  .reveal-box{
    margin-top:10px;
    background:var(--tint);
    border-left:4px solid var(--blue);
    padding:16px 18px;
    border-radius:10px;
    display:none;
  }
  .reveal-box.show{display:block; animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .reveal-box h4{
    margin:0 0 8px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:19px;
    color:var(--blue-dark);
  }

  /* ---------- Question Cards (Reflection & Exercise) ---------- */
  .question-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    margin-top:18px;
  }
  .question-card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:0 4px 14px var(--shadow-card);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .question-card .qtext{
    font-size:13.5px;
    font-weight:600;
    line-height:1.5;
    color:var(--ink);
  }
  .question-card .level-badge{margin-left:0; align-self:flex-start;}
  .question-card textarea{
    min-height:70px;
    font-size:13px;
    flex:1;
  }
  .question-grid.exercise-grid{
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
  }
  .exercise-grid .question-card{padding:22px;}
  .exercise-grid .question-card .qtext{font-size:15px;}
  @media (max-width:820px){
    .question-grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:600px){
    .question-grid{grid-template-columns:1fr;}
  }

  /* ---------- Quiz page ---------- */
  .quiz-q{
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .quiz-q:last-of-type{border-bottom:none;}
  .quiz-q .qnum{
    font-family:'Inter', sans-serif;
    font-size:11px;
    color:var(--orange-dark);
    letter-spacing:0.08em;
    font-weight:700;
    text-transform:uppercase;
  }
  .level-badge{
    display:inline-block;
    background:linear-gradient(135deg, var(--orange-light), var(--orange-dark));
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:2px 9px;
    border-radius:999px;
    margin-left:6px;
  }
  .quiz-q p.qtext{margin:4px 0 12px; font-weight:600; font-size:15.5px; color:var(--ink);}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:8px;
    cursor:pointer;
    background:var(--white);
    transition:all .15s ease;
  }
  .opt:hover{border-color:var(--blue);}
  .opt input{margin-top:3px;}
  .opt.correct{border-color:var(--ok-border); background:var(--ok-bg);}
  .opt.incorrect{border-color:var(--err-border); background:var(--err-bg);}
  .quiz-explain{
    display:none;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
    padding-left:2px;
  }
  .quiz-explain.show{display:block;}
  .score-panel{
    margin-top:8px;
    background:var(--ok-bg);
    border:1px solid var(--ok-border);
    border-radius:16px;
    padding:18px 20px;
  }
  .score-panel h4{margin:0 0 6px; font-family:'Poppins', sans-serif; font-weight:600; font-size:22px; color:var(--ok-text);}
  .final-panel{
    margin-top:16px;
    background:var(--footer-dark);
    color:#fff;
    border-radius:16px;
    padding:24px;
    display:none;
  }
  .final-panel.show{display:block; animation:fadeIn .5s ease;}
  .final-panel h4{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 8px;
    color:var(--orange-light);
  }
  .final-panel p{
    color:#EDF3FA;
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Poppins', sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:none;
    padding:12px 24px;
    border-radius:999px;
    border:1.5px solid var(--blue);
    background:transparent;
    color:var(--blue-dark);
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 4px 12px var(--shadow-btn);}
  .btn:active:not(:disabled){transform:translateY(0); box-shadow:none;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-primary{
    background:linear-gradient(135deg, var(--blue-light), var(--blue-dark));
    border-color:transparent;
    color:#fff;
    box-shadow:0 4px 14px var(--shadow-btn);
  }
  .btn-primary:hover:not(:disabled){box-shadow:0 6px 18px var(--shadow-btn);}
  .btn-rush{
    background:linear-gradient(135deg, var(--orange-light), var(--orange-dark));
    border-color:transparent;
    color:#fff;
    box-shadow:0 4px 14px rgba(201,111,31,0.3);
  }
  .btn-rush:hover:not(:disabled){box-shadow:0 6px 18px rgba(201,111,31,0.35);}
  .btn-ghost{background:transparent; border-color:var(--border); color:var(--ink-soft);}

  /* ---------- Footer Nav ---------- */
  .app-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }
  .nav-status{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--faint);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(31,46,55,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--card);
    border-radius:16px;
    max-width:380px;
    width:100%;
    padding:26px;
    border-top:5px solid var(--orange);
    box-shadow:0 12px 32px var(--shadow-card);
  }
  .modal-box h4{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 10px;
    color:var(--orange-dark);
  }
  .modal-box p{font-size:14px; margin:0 0 20px; color:var(--ink-soft);}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}

  @media (max-width:600px){
    .brand h1{font-size:28px;}
    .rail-label{display:none;}
    .card{padding:24px 18px;}
    h2.page-title{font-size:26px;}
    .order-board{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="eyebrow">Case Study</span>
      <h1>The Griddle</h1>
    </div>
    <nav class="rail" id="rail"></nav>
  </header>

  <div class="stage-wrap">
    <div class="card" id="stage"></div>
  </div>

  <footer class="app-nav">
    <button class="btn btn-ghost" id="backBtn">← Back</button>
    <span class="nav-status" id="navStatus"></span>
    <button class="btn btn-primary" id="nextBtn">Next →</button>
  </footer>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h4>Heads up</h4>
    <p id="modalText">Going back will clear your progress on this page. You'll need to redo it to move forward again. Continue?</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-rush" id="modalConfirm">Yes, go back</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---------------------------------------------------------
  // Config
  // ---------------------------------------------------------
  var SHELF_SIZE = 3;
  var PANTRY_COST = 4;
  var SHELF_COST = 1;
  var ORDER_QUEUE = ['Burger','Fries','Burger','Salad','Fries','Burger','Pasta','Fries'];
  var MORNING_ORDERS = ['Fries','Burger','Soup','Fries','Burger','Soup','Fries','Salad','Burger','Fries'];
  var DISH_EMOJI = {Burger:'🍔', Fries:'🍟', Salad:'🥗', Pasta:'🍝', Soup:'🍲'};
  var FACES = ['🧑','👩','🧔','👨','🧕','👵','👴','🧑\u200d🦱'];
  var BASELINE_TIME = ORDER_QUEUE.length * PANTRY_COST;

  var REFLECT_QUESTIONS = [
    "When several tasks were waiting, what helped you decide which one to handle first?",
    "Why was choosing the most important task first more useful than simply following the arrival order?",
    "As more tasks were added, how did you keep track of which task deserved attention next?",
    "What would happen if you had to search through every waiting task each time? How might that affect your work as the number of tasks grows?",
    "Looking at the activity as a whole, what pattern made it possible to handle changing priorities efficiently?"
  ];

  var EXERCISE_QUESTIONS = [
    {
      level: "New Problem",
      q: "A hospital has patients arriving at different times, but the most critical patient should always be treated first. How would you organize the waiting patients so the next patient can be chosen efficiently?"
    },
    {
      level: "Recognize Usefulness",
      q: "A task manager allows a user to increase the importance of a task at any time. Why would a Priority Queue be useful here, and what operation would become important when a task's importance changes?"
    },
    {
      level: "Reason About a Design",
      q: "Two systems manage the same jobs. System A keeps jobs in arrival order and searches through them to find the most urgent job. System B uses a Priority Queue. As the number of jobs becomes very large, how would you expect their performance to differ, and why?"
    },
    {
      level: "Challenge a Misconception",
      q: "A student argues, \"If I need the highest-priority item quickly, I should keep the entire collection completely sorted at all times.\" Do you agree? Compare this approach with a Priority Queue and explain why maintaining a completely sorted collection may do unnecessary work."
    },
    {
      level: "Changing Requirements",
      q: "A system originally chooses the highest-priority task first. Now the requirement changes: among tasks with equal priority, the task that has waited the longest must be chosen first. How would this change the way you represent or compare tasks?"
    },
    {
      level: "Efficiency & Scaling",
      q: "A system handles 100 jobs today but may eventually handle 10 million. If each new job can have a different priority, what kind of operations would you want to remain efficient, and why does that matter more at the larger scale?"
    },
    {
      level: "Real-World Reasoning",
      q: "An emergency response system receives fire, medical, and police requests with different urgency levels. If priorities can change while requests are waiting, how would you design the system so that the next response is chosen appropriately without repeatedly examining every request?"
    }
  ];

  // ---------------------------------------------------------
  // State
  // ---------------------------------------------------------
  function defaultGameData(){
    return {
      queue: ORDER_QUEUE.slice(),
      index: 0,
      shelf: [],
      elapsed: 0,
      phase: 'idle', // idle | awaiting-evict | served-waiting
      pendingDish: null,
      lastServed: null,
      log: [],
      done: false,
      rushStarted: false,
      morning: {
        queue: MORNING_ORDERS.slice(),
        index: 0,
        tally: {},
        firstSeen: [],
        phase: 'filling' // filling | loaded
      }
    };
  }
  function defaultReflectData(){
    return {};
  }
  function defaultQuizData(){
    return { finished:false };
  }

  function buildInitialState(){
    return {
      current: 0,
      maxUnlocked: 0,
      pages: [
        { id:'problem' },
        { id:'intro' },
        { id:'game', data: defaultGameData() },
        { id:'reflect', data: defaultReflectData() },
        { id:'concept' },
        { id:'quiz', data: defaultQuizData() }
      ]
    };
  }

  var state = buildInitialState();

  var pageLabels = ['Introduction','The Setup','Rush Hour','Debrief','Concept','Quick Check'];

  function isPageComplete(idx){
    return true;
  }

  function resetPage(idx){
    if(idx === 2) state.pages[2].data = defaultGameData();
    if(idx === 3) state.pages[3].data = defaultReflectData();
    if(idx === 5) state.pages[5].data = defaultQuizData();
  }

  // ---------------------------------------------------------
  // Rail
  // ---------------------------------------------------------
  function renderRail(){
    var rail = document.getElementById('rail');
    var html = '';
    for(var i=0;i<6;i++){
      var cls = 'rail-step';
      if(i === state.current) cls += ' active';
      else if(i < state.current) cls += ' done';
      else cls += ' locked';
      html += '<div class="'+cls+'">';
      html += '<div class="rail-dot">'+ (i < state.current ? '✓' : (i>state.current ? '🔒' : (i+1))) +'</div>';
      html += '<div class="rail-label">'+pageLabels[i]+'</div>';
      html += '</div>';
      if(i < 5) html += '<div class="rail-connector"></div>';
    }
    rail.innerHTML = html;
  }

  // ---------------------------------------------------------
  // Stage renderers
  // ---------------------------------------------------------
  function renderStage(){
    var stage = document.getElementById('stage');
    var id = state.pages[state.current].id;
    if(id === 'problem') stage.innerHTML = problemHTML();
    if(id === 'intro') stage.innerHTML = introHTML();
    if(id === 'game') stage.innerHTML = gameHTML();
    if(id === 'reflect') stage.innerHTML = reflectHTML();
    if(id === 'concept') stage.innerHTML = conceptHTML();
    if(id === 'quiz') stage.innerHTML = quizHTML();
  }

  function problemHTML(){
    return ''+
    '<span class="kicker">Step 1 of 6 — Introduction</span>'+
    '<h2 class="page-title">Introduction</h2>'+
    '<p class="lead">Some things get used far more than others, and reaching them quickly matters. A mechanic keeps everyday tools by the workbench, not the storeroom. A shopkeeper keeps fast-sellers near the counter, not the back shelves.</p>'+
    '<div class="goal-box">'+
      '<strong>The question:</strong> space close at hand is always limited. How do you decide what stays within reach, and what gets sent back, as needs keep changing?'+
    '</div>'+
    '<div class="goal-box" style="margin-top:14px;">'+
      '<strong>The setup:</strong> Chef Wren\'s warming shelf has just <strong>3 sections</strong>. Everything else means a trip to the pantry. What stays on the shelf — and when do you swap something out?'+
    '</div>'+
    '<p class="muted" style="margin-top:18px;">Tap <strong>Next</strong> to find out.</p>';
  }

  function introHTML(){
    return ''+
    '<span class="kicker">Step 2 of 6 — The Setup</span>'+
    '<h2 class="page-title">Meet Chef Wren</h2>'+
    '<p class="lead">Chef Wren runs the counter alone during the rush — and is about to put your thinking to the test.</p>'+
    '<div class="goal-box">'+
      '<strong>How it works:</strong> for each order, tap <strong>Serve</strong>. If the dish is already on the shelf, it\'s quick. If not, it means a trip to the pantry — and if the shelf is full, you\'ll pick which dish to swap out first.'+
    '</div>'+
    '<p class="muted" style="margin-top:18px;">Tap <strong>Next</strong> to step behind the counter.</p>';
  }

  function morningSceneHTML(g){
    var m = g.morning;
    var html = '';

    html += '<div class="morning-intro" style="text-align:left; padding:16px 18px;">';
    html += '<p class="lead" style="margin:0;">Before the shop even opened, customers were already lining up outside placing their orders — so Chef Wren already has a good idea of what\'s about to be in demand. Bring them in one at a time and watch what starts trending.</p>';
    html += '</div>';

    html += '<div class="morning-scene">';

    html += '<div class="customer-lane">';
    if(m.index === 0){
      html += '<p class="muted" style="font-size:12.5px; margin:0;">No one\'s in line yet.</p>';
    }
    for(var i=0;i<m.index;i++){
      var dish = m.queue[i];
      var face = FACES[i % FACES.length];
      html += '<div class="customer-chip"><div class="face">'+face+'</div><div class="order-bubble">'+DISH_EMOJI[dish]+' '+dish+'</div></div>';
    }
    html += '</div>';

    var dishes = Object.keys(m.tally).sort(function(a,b){
      if(m.tally[b] !== m.tally[a]) return m.tally[b] - m.tally[a];
      return m.firstSeen.indexOf(a) - m.firstSeen.indexOf(b);
    });
    var top3 = dishes.slice(0,3);
    var maxCount = 0;
    for(var k=0;k<dishes.length;k++){ if(m.tally[dishes[k]] > maxCount) maxCount = m.tally[dishes[k]]; }

    html += '<div class="trend-board"><h4>What\'s Trending</h4>';
    if(dishes.length === 0){
      html += '<p class="muted" style="font-size:12.5px;">Waiting for the first order…</p>';
    }
    for(var d=0; d<dishes.length; d++){
      var dn = dishes[d];
      var isTop = (m.phase === 'loaded') && top3.indexOf(dn) !== -1;
      var pct = maxCount ? Math.round((m.tally[dn]/maxCount)*100) : 0;
      html += '<div class="trend-row'+(isTop?' top3':'')+'">';
      html += '<span class="trend-emoji">'+DISH_EMOJI[dn]+'</span>';
      html += '<span class="trend-name">'+dn+'</span>';
      html += '<span class="trend-bar-wrap"><span class="trend-bar" style="width:'+pct+'%"></span></span>';
      html += '<span class="trend-count">'+m.tally[dn]+'</span>';
      html += '</div>';
    }
    html += '</div>';

    html += '</div>'; // .morning-scene

    if(m.phase === 'loaded'){
      var shelfList = g.shelf.map(function(dd){ return DISH_EMOJI[dd]+' '+dd; }).join(', ');
      html += '<div class="morning-loaded-note">✅ Top 3 loaded onto the shelf: '+shelfList+'</div>';
      html += '<div class="action-row"><button class="btn btn-primary" data-action="start-rush">Start the Rush →</button></div>';
    } else {
      var label = m.index === 0 ? '👉 Let the First Customer In' : '👉 Next Customer';
      html += '<div class="action-row"><button class="btn btn-primary" data-action="next-morning-customer">'+label+'</button></div>';
    }

    return html;
  }

  function gameHTML(){
    var g = state.pages[2].data;
    var html = '<span class="kicker">Step 3 of 6 — Rush Hour</span>';
    html += '<h2 class="page-title">Serve the Line</h2>';

    if(!g.rushStarted){
      html += morningSceneHTML(g);
      return html;
    }

    html += '<div class="rule-line">One rule: a dish <strong>stays on the shelf</strong> after you serve it — it only leaves if you swap it out for something else.</div>';

    html += '<div class="hud">';
    html += '<div class="hud-item"><span class="val">'+g.elapsed+'</span><span class="lbl">Time Spent</span></div>';
    html += '<div class="hud-item"><span class="val">'+g.log.length+' / '+g.queue.length+'</span><span class="lbl">Orders Served</span></div>';
    html += '</div>';

    if(g.log.length > 0){
      html += '<div class="history-panel"><h4>Past Orders</h4><div class="ticket-row">';
      for(var i=0;i<g.log.length;i++){
        var entry = g.log[i];
        var tag = entry.source === 'shelf' ? '⚡' : '🚚';
        html += '<div class="mini-ticket"><span class="mini-tag">'+tag+'</span>'+DISH_EMOJI[entry.dish]+' '+entry.dish+'</div>';
      }
      html += '</div></div>';
    }

    if(g.done){
      html += gameSummaryHTML(g);
      return html;
    }

    if(g.phase === 'served-waiting'){
      html += '<div class="served-note">✅ Served '+DISH_EMOJI[g.lastServed]+' '+g.lastServed+'. That customer heads off happy.</div>';
      html += '<div class="action-row"><button class="btn btn-primary" data-action="next-customer">👉 Next Customer</button></div>';
      return html;
    }

    var currentDish = g.queue[g.index];
    var onShelf = g.shelf.indexOf(currentDish) !== -1;

    html += '<div class="order-board">';
    html += '<div class="ticket-big"><span class="order-no">Order #'+(g.index+1)+' of '+g.queue.length+'</span>';
    html += '<div class="emoji">'+DISH_EMOJI[currentDish]+'</div>';
    html += '<div class="dish-name">'+currentDish+'</div>';
    html += '</div>';

    html += '<div class="shelf-panel"><h4>Warming Shelf — stays until swapped</h4><div class="shelf-slots">';
    for(var s=0;s<SHELF_SIZE;s++){
      if(g.shelf[s]){
        var evictable = g.phase === 'awaiting-evict';
        html += '<div class="shelf-slot'+(evictable?' evictable':'')+'" '+(evictable ? 'data-action="evict" data-dish="'+g.shelf[s]+'"' : '')+'>';
        html += '<div class="se">'+DISH_EMOJI[g.shelf[s]]+'</div>'+g.shelf[s];
        html += '</div>';
      } else {
        html += '<div class="shelf-slot empty">empty</div>';
      }
    }
    html += '</div></div>';
    html += '</div>';

    html += '<div class="fetch-bar-wrap" id="fetchBarWrap"><div class="fetch-bar" id="fetchBar"></div></div>';
    html += '<div class="fetch-caption" id="fetchCaption">Jogging to the pantry…</div>';

    if(g.phase === 'awaiting-evict'){
      html += '<div class="evict-banner">Shelf\'s full. Tap the dish above you want to remove to make room for '+DISH_EMOJI[g.pendingDish]+' '+g.pendingDish+'.</div>';
    } else {
      html += '<div class="status-line '+(onShelf ? 'status-good' : 'status-warn')+'">';
      if(onShelf){
        html += '✅ '+currentDish+' is already on the shelf — serving it will be quick.';
      } else if(g.shelf.length < SHELF_SIZE){
        html += '🚚 '+currentDish+' is not on the shelf yet — you\'ll need to fetch it.';
      } else {
        html += '🚚 '+currentDish+' is not on the shelf, and the shelf is full — you\'ll need to fetch it and clear a spot.';
      }
      html += '</div>';
      html += '<div class="action-row">';
      html += '<button class="btn btn-primary" id="serveBtn" data-action="serve">Serve This Order</button>';
      html += '</div>';
    }

    return html;
  }

  function gameSummaryHTML(g){
    var rating, ratingColor;
    if(g.elapsed <= 16){ rating = "Great instincts."; }
    else if(g.elapsed <= 22){ rating = "Solid run."; }
    else{ rating = "You made it — but a lot of pantry trips."; }

    var html = '<div class="game-summary">';
    html += '<h4>Rush Over — Line Cleared 🎉</h4>';
    html += '<p>'+rating+' You spent <strong>'+g.elapsed+'</strong> time units serving '+g.queue.length+' orders.</p>';
    html += '<div class="compare-row">';
    html += '<div class="compare-item"><span class="num">'+BASELINE_TIME+'</span>Time if every single order meant a pantry trip</div>';
    html += '<div class="compare-item"><span class="num">'+g.elapsed+'</span>Your time</div>';
    html += '<div class="compare-item"><span class="num">'+Math.max(0, BASELINE_TIME - g.elapsed)+'</span>Time you saved</div>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  function reflectHTML(){
    var html = '<span class="kicker">Step 4 of 6 — Debrief</span>';
    html += '<h2 class="page-title">Back of House</h2>';
    html += '<p class="lead">The rush is over. Take a moment on each of these before moving on.</p>';

    html += '<div class="question-grid">';
    for(var i=0;i<REFLECT_QUESTIONS.length;i++){
      html += '<div class="question-card">';
      html += '<div class="qtext">'+REFLECT_QUESTIONS[i]+'</div>';
      html += '</div>';
    }
    html += '</div>';

    return html;
  }

  function conceptHTML(){
    var html = '<span class="kicker">Step 5 of 6 — Concept</span>';
    html += '<h2 class="page-title">Naming the Pattern</h2>';
    html += '<p class="lead">What you just practiced has a name: a <strong>Priority Queue</strong>.</p>';

    html += '<div class="goal-box">';
    html += '<strong>Definition:</strong> a Priority Queue is a collection where every item holds a priority, and the item removed next is always the one with the <strong>highest priority</strong> — not simply the one that arrived first.';
    html += '</div>';

    html += concept_diagramSVG();

    html += '<div class="scene three-col">';
    html += '<div class="scene-card"><h3>Insert</h3><p>Add a new item along with its priority. It can join the queue anywhere — order is decided by priority, not arrival.</p></div>';
    html += '<div class="scene-card"><h3>Peek</h3><p>Look at the highest-priority item without removing it — like checking the shelf before serving.</p></div>';
    html += '<div class="scene-card"><h3>Extract</h3><p>Remove and return the highest-priority item — the one served next.</p></div>';
    html += '</div>';

    html += '<p class="muted" style="margin-top:18px;">A regular queue is strictly first-in, first-out. A Priority Queue lets a more urgent item jump ahead — exactly like a shelf that always keeps the busiest order within reach.</p>';

    return html;
  }

  function concept_diagramSVG(){
    var items = [
      {label:'Item A', pr:3},
      {label:'Item B', pr:9},
      {label:'Item C', pr:5},
      {label:'Item D', pr:1}
    ];
    var w = 700, h = 150, boxW = 130, gap = 20, startX = 20;
    var svg = '<div style="margin:20px 0; overflow-x:auto;">';
    svg += '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:700px; display:block; margin:0 auto;" xmlns="http://www.w3.org/2000/svg">';
    for(var i=0;i<items.length;i++){
      var x = startX + i*(boxW+gap);
      var isTop = items[i].pr === 9;
      var fill = isTop ? 'var(--orange)' : 'var(--blue-light)';
      var textColor = isTop ? '#fff' : 'var(--ink)';
      svg += '<rect x="'+x+'" y="40" width="'+boxW+'" height="60" rx="12" fill="'+fill+'" stroke="var(--border)"/>';
      svg += '<text x="'+(x+boxW/2)+'" y="65" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="'+textColor+'">'+items[i].label+'</text>';
      svg += '<text x="'+(x+boxW/2)+'" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="'+textColor+'">Priority: '+items[i].pr+'</text>';
      if(isTop){
        svg += '<text x="'+(x+boxW/2)+'" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="var(--orange-dark)">SERVED NEXT ▾</text>';
      }
    }
    svg += '</svg>';
    svg += '</div>';
    return svg;
  }

  function quizHTML(){
    var qd = state.pages[5].data;
    var html = '<span class="kicker">Step 6 of 6 — Quick Check</span>';
    html += '<h2 class="page-title">Would It Work Anywhere Else?</h2>';
    html += '<p class="lead">Same idea, different settings. Work through these.</p>';

    if(!qd.finished){
      html += '<div class="question-grid exercise-grid">';
      for(var i=0;i<EXERCISE_QUESTIONS.length;i++){
        var item = EXERCISE_QUESTIONS[i];
        html += '<div class="question-card">';
        html += '<span class="level-badge">'+item.level+'</span>';
        html += '<div class="qtext">'+item.q+'</div>';
        html += '</div>';
      }
      html += '</div>';

      html += '<button class="btn btn-primary" id="exerciseFinishBtn" data-action="quiz-finish" style="margin-top:16px;">See Case Study Summary</button>';
    } else {
      html += finalPanelHTML();
    }

    return html;
  }

  function finalPanelHTML(){
    var g = state.pages[2].data;
    var html = '<div class="final-panel show">';
    html += '<h4>Case Study Complete</h4>';
    html += '<p>Rush hour time: <strong>'+g.elapsed+'</strong> units (baseline was '+BASELINE_TIME+').</p>';
    html += '<p style="opacity:0.85;">You just built a working instinct for cache memory — a small, fast layer that sits between you and slower storage, holding on to whatever is likely to be needed again soon.</p>';
    html += '<button class="btn btn-primary" data-action="restart-app" style="margin-top:14px;">↺ Start Over</button>';
    html += '</div>';
    return html;
  }

  // ---------------------------------------------------------
  // Nav
  // ---------------------------------------------------------
  function renderNav(){
    var backBtn = document.getElementById('backBtn');
    var nextBtn = document.getElementById('nextBtn');
    var status = document.getElementById('navStatus');

    backBtn.style.visibility = state.current === 0 ? 'hidden' : 'visible';

    if(state.current === 5){
      nextBtn.style.visibility = 'hidden';
    } else {
      nextBtn.style.visibility = 'visible';
      nextBtn.disabled = !isPageComplete(state.current);
      nextBtn.textContent = isPageComplete(state.current) ? 'Next →' : 'Complete this step →';
    }

    status.textContent = 'Step ' + (state.current+1) + ' of 6';
  }

  function render(){
    renderRail();
    renderStage();
    renderNav();
    var appEl = document.querySelector('.app');
    if(appEl){
      appEl.classList.toggle('wide-page', state.pages[state.current].id === 'quiz');
    }
  }

  // ---------------------------------------------------------
  // Modal
  // ---------------------------------------------------------
  function showModal(){
    document.getElementById('modalOverlay').classList.add('show');
  }
  function hideModal(){
    document.getElementById('modalOverlay').classList.remove('show');
  }

  document.getElementById('modalCancel').addEventListener('click', hideModal);
  document.getElementById('modalConfirm').addEventListener('click', function(){
    hideModal();
    var leaving = state.current;
    resetPage(leaving);
    state.current = leaving - 1;
    state.maxUnlocked = state.current;
    render();
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    if(state.current === 0) return;
    showModal();
  });

  document.getElementById('nextBtn').addEventListener('click', function(){
    if(!isPageComplete(state.current)) return;
    if(state.current >= 5) return;
    state.current++;
    state.maxUnlocked = Math.max(state.maxUnlocked, state.current);
    render();
  });

  // ---------------------------------------------------------
  // Game interactions
  // ---------------------------------------------------------
  function advanceOrder(dish, source){
    var g = state.pages[2].data;
    g.log.push({dish: dish, source: source});
    g.lastServed = dish;
    g.index++;
    g.pendingDish = null;
    if(g.index >= g.queue.length){
      g.phase = 'idle';
      g.done = true;
    } else {
      g.phase = 'served-waiting';
    }
    render();
  }

  function nextMorningCustomer(){
    var g = state.pages[2].data;
    var m = g.morning;
    if(m.index >= m.queue.length) return;

    var dish = m.queue[m.index];
    if(m.tally[dish] === undefined){
      m.tally[dish] = 0;
      m.firstSeen.push(dish);
    }
    m.tally[dish]++;
    m.index++;

    if(m.index >= m.queue.length){
      var dishes = Object.keys(m.tally).sort(function(a,b){
        if(m.tally[b] !== m.tally[a]) return m.tally[b] - m.tally[a];
        return m.firstSeen.indexOf(a) - m.firstSeen.indexOf(b);
      });
      g.shelf = dishes.slice(0,3);
      m.phase = 'loaded';
    }
    render();
  }

  function handleServe(){
    var g = state.pages[2].data;
    var dish = g.queue[g.index];
    var onShelf = g.shelf.indexOf(dish) !== -1;

    if(onShelf){
      g.elapsed += SHELF_COST;
      advanceOrder(dish, 'shelf');
      return;
    }

    if(g.shelf.length >= SHELF_SIZE){
      g.phase = 'awaiting-evict';
      g.pendingDish = dish;
      render();
      return;
    }

    runFetchAnimation(function(){
      g.elapsed += PANTRY_COST;
      g.shelf.push(dish);
      advanceOrder(dish, 'pantry');
    });
  }

  function evictAndFetch(dishToRemove){
    var g = state.pages[2].data;
    var idx = g.shelf.indexOf(dishToRemove);
    if(idx === -1) return;
    var incoming = g.pendingDish;

    runFetchAnimation(function(){
      g.shelf.splice(idx,1);
      g.elapsed += PANTRY_COST;
      g.shelf.push(incoming);
      advanceOrder(incoming, 'pantry');
    });
  }

  function runFetchAnimation(done){
    var wrap = document.getElementById('fetchBarWrap');
    var bar = document.getElementById('fetchBar');
    var caption = document.getElementById('fetchCaption');
    var btn = document.getElementById('serveBtn');
    if(btn) btn.disabled = true;
    if(wrap) wrap.classList.add('show');
    if(caption) caption.classList.add('show');
    if(bar){
      bar.style.width = '0%';
      requestAnimationFrame(function(){
        setTimeout(function(){ bar.style.width = '100%'; }, 20);
      });
    }
    setTimeout(done, 900);
  }

  // ---------------------------------------------------------
  // Delegated click / input handling on stage
  // ---------------------------------------------------------
  document.getElementById('stage').addEventListener('click', function(e){
    var target = e.target.closest('[data-action]');
    if(!target) return;
    var action = target.getAttribute('data-action');

    if(action === 'serve') handleServe();
    if(action === 'evict') evictAndFetch(target.getAttribute('data-dish'));
    if(action === 'next-morning-customer') nextMorningCustomer();
    if(action === 'next-customer'){
      state.pages[2].data.phase = 'idle';
      render();
    }
    if(action === 'start-rush'){
      state.pages[2].data.rushStarted = true;
      render();
    }
    if(action === 'quiz-finish'){
      state.pages[5].data.finished = true;
      render();
    }
    if(action === 'restart-app'){
      state = buildInitialState();
      render();
    }
  });

  // ---------------------------------------------------------
  // Init
  // ---------------------------------------------------------
  render();

})();
</script>
</body>
